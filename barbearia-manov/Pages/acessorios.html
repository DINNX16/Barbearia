<html lang="pt-br">

    <title>Acessórios e Filtros - Barbearia Manóv</title>
        <link

      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap"
      rel="stylesheet"
    />

  </head>

  <body>
    <div
      id="loading"
      style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #fef7cd, #fed7aa);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        font-family: 'Montserrat', sans-serif;
        transition: opacity 0.5s ease;
      "
    >
      <img
        id="moeda"
        src="https://raw.githubusercontent.com/DINNX16/Barbearia/main/barbearia-manov/assets/moedamoeda.png"
        alt="Moeda"
        style="

          height: 150px;

          filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));

      <h2 style="color: #92400e; margin-top: 20px; font-size: 24px">
        Barbearia Manóv
      </h2>
      <p style="color: #78350f; font-size: 16px">Carregando...</p>
      <div
        id="contador"
        style="

    <header class="header">
      <div class="logo">
        <a href="main.html" style="text-decoration: none; color: inherit">
          <h1>Barbearia Manóv</h1>
        </a>
      </div>
    </header>
    <main class="main-content">
      <div class="filters-section">
        <div class="filters-header">
          <h2 class="filters-title">🔍 Filtros Avançados</h2>
        </div>
        <div class="results-count" id="resultsCount"></div>
        <div class="filters-container">
          <div class="filter-group">
            <h3 class="filter-group-title">Categoria</h3>
            <div class="filter-options">
              <div class="filter-option">
                <input
                  type="checkbox"
                  id="pomadas"
                  name="category"
                  value="pomadas"
                /><label for="pomadas">Pomadas</label>
              </div>
              <div class="filter-option">
                <input
                  type="checkbox"
                  id="oleos"
                  name="category"
                  value="oleos"
                /><label for="oleos">Óleos e Shampoos</label>
              </div>
              <div class="filter-option">
                <input
                  type="checkbox"
                  id="ferramentas"
                  name="category"
                  value="ferramentas"
                /><label for="ferramentas">Ferramentas</label>
              </div>
              <div class="filter-option">
                <input
                  type="checkbox"
                  id="acessorios"
                  name="category"
                  value="acessorios"
                /><label for="acessorios">Acessórios</label>
              </div>
            </div>
          </div>
          <div class="filter-group">
            <h3 class="filter-group-title">Faixa de Preço</h3>
            <div class="price-inputs">
              <input
                type="number"
                class="price-input"
                id="minPrice"
                placeholder="Min R$"
                min="0"
              />
              <input
                type="number"
                class="price-input"
                id="maxPrice"
                placeholder="Max R$"
                min="0"
              />
            </div>
          </div>
          <div class="filter-group">
            <h3 class="filter-group-title">Marca</h3>
            <div class="filter-options">
              <div class="filter-option">
                <input
                  type="checkbox"
                  id="qod"
                  name="brand"
                  value="QOD"
                /><label for="qod">QOD Barber Shop</label>
              </div>
              <div class="filter-option">
                <input
                  type="checkbox"
                  id="uppercut"
                  name="brand"
                  value="Uppercut"
                /><label for="uppercut">Uppercut</label>
              </div>
              <div class="filter-option">
                <input
                  type="checkbox"
                  id="trueman"
                  name="brand"
                  value="TrueMan"
                /><label for="trueman">TrueMan</label>
              </div>
            </div>
          </div>
        </div>
        <div class="filter-actions">
          <button class="btn-filter btn-apply" onclick="applyFilters()">
            Aplicar Filtros
          </button>
          <button class="btn-filter btn-clear" onclick="clearFilters()">
            Limpar Tudo
          </button>
        </div>
      </div>

      <div id="carousels-wrapper">
        <div class="carousel-section">
          <h2 class="carousel-title">Acessórios em Destaque</h2>
          <div class="carousel-container">
            <div class="carousel-wrapper">
              <div class="carousel-track" id="carousel-track-1"></div>
              <button class="carousel-nav nav-prev" onclick="moveSlide(-1, 0)">
                &#8249;
              </button>
              <button class="carousel-nav nav-next" onclick="moveSlide(1, 0)">
                &#8250;
              </button>
            </div>
          </div>
        </div>
      </div>

      <div
        id="no-results"
        style="
          display: none;
          text-align: center;
          padding: 40px;
          background: white;
          border-radius: 12px;
          margin: 20px;
        "
      >
        <h3>Nenhum produto encontrado.</h3>
        <p>Tente alterar ou limpar os filtros.</p>
      </div>

      <div class="expandable-section">
        <h2 class="carousel-title">Destaques da Loja</h2>
        <div class="expandable-container" id="expandable-container-1">
          <div class="expandable-wrapper" id="expandable-wrapper-1"></div>
          <button
            class="btn-expand"
            onclick="toggleExpand('expandable-container-1', this)"
          >
            <span id="expand-btn-text">Expandir</span> <i class="arrow"></i>
          </button>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>© 2025 Barbearia Manóv - Todos os direitos reservados</p>
    </footer>

    <script>
      let contador = 3;

      function iniciarLoading() {
        let contadorEl = document.getElementById("contador");

        let intervalo = setInterval(() => {
          contador--;
          if (contadorEl) {
            contadorEl.textContent = contador;
          }

          if (contador <= 0) {
            clearInterval(intervalo);
            // Esconde loading
            const loadingEl = document.getElementById("loading");
            if (loadingEl) {
              loadingEl.style.opacity = "0";
              setTimeout(() => {
                loadingEl.style.display = "none";
                const conteudoEl = document.getElementById("conteudo");
                if (conteudoEl) {
                  conteudoEl.classList.add("mostrar");
                }
              }, 500);
            }
          }
        }, 1000);
      }

      // Apenas executa se o elemento de loading existir na página
      if (document.getElementById("loading")) {
        setTimeout(iniciarLoading, 100);
      }

      // --- FUNÇÕES DE MENU E NAVEGAÇÃO ---
      function openNav() {
        document.getElementById("myNav").style.width = "50%";
      }

      function closeNav() {
        document.getElementById("myNav").style.width = "0%";
      }

      function performSearch() {
        const searchTerm = document.querySelector(".search-header input").value;
        if (searchTerm.trim()) {
          alert(`Buscando por: ${searchTerm}`);
        }
      }

      // --- BANCO DE DADOS DE PRODUTOS (Exemplo) ---

        {

        },
        {

          title: "Gel Fixador",

      ];
      const masterProductsFerramentas = [
        {
          id: 7,

        {

        },
        {
          id: 9,

          brand: "TrueMan",
          icon: "✂️",
        },
        {
          id: 10,
          title: "Borrifador de Alumínio",

          brand: "QOD",
          icon: "💨",
        },
        {

        },
        {
          id: 12,

        },
      ];
      const tableProducts = [
        {
          id: 13,
          title: "Loção Pós-Barba",
          price: "42.50",
          icon: "🌿",
        },
        {
          id: 14,

          price: "38.00",
          icon: "✨",
        },
        {
          id: 15,
          title: "Escova de Cerdas",
          price: "22.00",
          icon: "🖌️",
        },
        {
          id: 16,
          title: "Pó Modelador",
          price: "55.00",
          icon: "💨",
        },
        {
          id: 17,
          title: "Spray de Brilho",
          price: "33.70",
          icon: "💧",
        },
        {
          id: 18,
          title: "Kit Viagem",
          price: "99.90",
          icon: "✈️",
        },
        {
          id: 19,
          title: "Toalha Quente",
          price: "15.00",
          icon: "🧖",
        },
        {
          id: 20,
          title: "Tônico Capilar",
          price: "65.00",
          icon: "🌱",
        },
      ];

      let allCarousels = [
        [...masterProductsAcessorios],
        [...masterProductsFerramentas],
      ];
      let currentSlides = [0, 0];

      // --- FUNÇÕES DE RENDERIZAÇÃO ---
      function createProductCard(product) {
        return `
                <div class="product-card">
                  <div class="product-image">${product.icon}</div>
                  <div class="product-info">
                    <h3 class="product-title">${product.title}</h3>
                    <div class="product-price">
                      <span class="price">R$ ${parseFloat(product.price)
                        .toFixed(2)
                        .replace(".", ",")}</span>
                      <button class="btn-comprar">Comprar</button>
                    </div>
                  </div>
                </div>`;
      }

      // --- LÓGICA DO CARROSSEL ---
      function initCarousel(carouselIndex) {
        const products = allCarousels[carouselIndex];
        const track = document.getElementById(
          `carousel-track-${carouselIndex + 1}`
        );
        if (track) {
          track.innerHTML =
            products.length > 0
              ? products.map(createProductCard).join("")
              : `<p style="padding: 20px; text-align: center; width: 100%;">Nenhum produto aqui.</p>`;
          currentSlides[carouselIndex] = 0;
          track.style.transform = "translateX(0px)";
        }
      }

      function moveSlide(direction, carouselIndex) {
        const track = document.getElementById(
          `carousel-track-${carouselIndex + 1}`
        );
        const products = allCarousels[carouselIndex];
        const cardWidth = 300; // Largura do card + gap
        const visibleCards = Math.floor(
          track.parentElement.offsetWidth / cardWidth
        );
        const maxSlides = Math.max(0, products.length - visibleCards);

        let newIndex = currentSlides[carouselIndex] + direction;
        if (newIndex < 0) {
          newIndex = 0;
        } else if (newIndex > maxSlides) {
          newIndex = maxSlides;
        }
        currentSlides[carouselIndex] = newIndex;
        track.style.transform = `translateX(-${newIndex * cardWidth}px)`;
      }

      // --- LÓGICA DOS FILTROS ---
      function applyFilters() {
        const minPrice =
          parseFloat(document.getElementById("minPrice").value) || 0;
        const maxPrice =
          parseFloat(document.getElementById("maxPrice").value) || Infinity;
        const selectedCategories = Array.from(
          document.querySelectorAll('input[name="category"]:checked')
        ).map((el) => el.value);
        const selectedBrands = Array.from(
          document.querySelectorAll('input[name="brand"]:checked')
        ).map((el) => el.value);

        const filterFunction = (product) => {
          const price = parseFloat(product.price);
          const categoryMatch =
            selectedCategories.length === 0 ||
            selectedCategories.includes(product.category);
          const brandMatch =
            selectedBrands.length === 0 ||
            !product.brand ||
            selectedBrands.includes(product.brand);
          const priceMatch = price >= minPrice && price <= maxPrice;
          return categoryMatch && brandMatch && priceMatch;
        };

        allCarousels[0] = masterProductsAcessorios.filter(filterFunction);
        allCarousels[1] = masterProductsFerramentas.filter(filterFunction);

        initCarousel(0);
        initCarousel(1);
        updateResults();
      }

      function clearFilters() {
        document
          .querySelectorAll('input[type="checkbox"], input[type="radio"]')
          .forEach((el) => (el.checked = false));
        document.getElementById("minPrice").value = "";
        document.getElementById("maxPrice").value = "";

        allCarousels = [
          [...masterProductsAcessorios],
          [...masterProductsFerramentas],
        ];
        initCarousel(0);
        initCarousel(1);
        updateResults();
      }

      function updateResults() {
        const totalFound = allCarousels.flat().length;
        document.getElementById(
          "resultsCount"
        ).innerHTML = `🎯 <strong>${totalFound}</strong> produtos encontrados`;

        const carouselsWrapper = document.getElementById("carousels-wrapper");
        const noResultsDiv = document.getElementById("no-results");

        carouselsWrapper.style.display = totalFound > 0 ? "block" : "none";
        noResultsDiv.style.display = totalFound > 0 ? "none" : "block";
      }

      // ===== LÓGICA DA SEÇÃO EXPANSÍVEL =====
      function initExpandableTable() {
        const wrapper = document.getElementById("expandable-wrapper-1");
        if (!wrapper) return;

        // Cria um único contêiner para todos os produtos
        const gridHTML = `
              <div class="expandable-product-grid">
                ${tableProducts.map(createProductCard).join("")}
              </div>
            `;
        wrapper.innerHTML = gridHTML;
      }

      function toggleExpand(containerId, buttonEl) {
        const container = document.getElementById(containerId);
        const buttonText = buttonEl.querySelector("span");
        container.classList.toggle("expanded");

        if (container.classList.contains("expanded")) {
          buttonText.textContent = "Recolher";
        } else {
          buttonText.textContent = "Expandir";
        }
      }

      // --- INICIALIZAÇÃO E EVENTOS ---
      document.addEventListener("DOMContentLoaded", function () {
        initCarousel(0);
        initCarousel(1);
        initExpandableTable(); // Inicializa a nova seção
        updateResults();

        document
          .querySelector(".search-header input")
          .addEventListener("keypress", function (e) {
            if (e.key === "Enter") {
              performSearch();
            }
          });
        document
          .querySelector(".btn-busca")
          .addEventListener("click", performSearch);
      });
    </script>

    <script src="js/auth.js"></script>
