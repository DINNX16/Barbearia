<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avaliações</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --primary: #1a1a1a;
      --secondary: #db902e;
      --light: #f8f9fa;
      --dark: #212529;
    }

    body {
      font-family: "Montserrat", sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--light);
      color: var(--dark);
    }

    .header {
      background-color: var(--primary);
      color: white;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 11px rgba(0, 0, 0, 0.1);
      position: relative;
      flex-shrink: 0;
      width: 100%;
      /* A
    dicione esta linha */


    }

    /* Título H1 dentro do Header */
    .header h1 {
      font-family: "Playfair Display", serif;
      color: var(--secondary);
      margin: 1rem 0;
      font-size: 1.8rem;
      text-align: center;
    }

    .container-avaliacoes {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: var(--light);
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .container-avaliacoes h2 {
      font-family: "Playfair Display", serif;
      color: var(--primary);
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.2rem;
    }

    .filtros-avaliacoes {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 0.5rem;
    }

    .filtros-avaliacoes label {
      font-family: "Montserrat", sans-serif;
      font-size: 0.9rem;
      color: var(--dark);
      font-weight: 500;
    }

    .filtros-avaliacoes select {
      font-family: "Montserrat", sans-serif;
      padding: 0.5rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      background-color: #fff;
      cursor: pointer;
    }

    .lista-avaliacoes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      /* Cria colunas responsivas */
      gap: 1.5rem;
      /* Espaçamento entre os cards */
      margin-bottom: 2rem;
    }

    .card-avaliacao {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .card-avaliacao:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    .card-avaliacao-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .nome-avaliador {
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1rem;
    }

    .data-avaliacao {
      font-family: "Montserrat", sans-serif;
      font-size: 0.8rem;
      color: #777;
    }

    .estrelas-avaliacao {
      margin-bottom: 1rem;
      font-size: 1.3rem;
      /* Tamanho das estrelas */
    }

    .estrelas-avaliacao span {
      /* Estilo para as estrelas */
      color: var(--secondary);
      /* Cor dourada para estrelas preenchidas */
      margin-right: 2px;
    }

    /* Para estrelas vazias, você pode usar um caractere diferente ou mudar a cor:
.estrelas-avaliacao span.vazia { color: #ccc; }
O JavaScript preencheria isso corretamente com base na nota. */


    .texto-avaliacao {
      font-family: "Montserrat", sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--dark);
      margin-bottom: 1rem;
      flex-grow: 1;
      /* Faz o texto ocupar o espaço disponível */
    }

    .avaliacao-servico-info {
      font-family: "Montserrat", sans-serif;
      font-size: 0.85rem;
      color: #555;
      padding-top: 0.75rem;
      border-top: 1px dashed #eee;
      margin-top: auto;
      /* Empurra para o final do card se o texto for curto */
    }

    .avaliacao-servico-info span {
      font-weight: 500;
    }


    .paginacao-avaliacoes {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #e0e0e0;
    }

    .paginacao-avaliacoes button {
      font-family: "Montserrat", sans-serif;
      background-color: var(--primary);
      color: var(--light);
      border: 1px solid var(--primary);
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .paginacao-avaliacoes button:hover:not(:disabled) {
      background-color: var(--secondary);
      color: var(--primary);
      border-color: var(--secondary);
    }

    .paginacao-avaliacoes button:disabled {
      background-color: #ccc;
      color: #666;
      border-color: #ccc;
      cursor: not-allowed;
    }

    .paginacao-avaliacoes #infoPaginaAvaliacoes {
      font-family: "Montserrat", sans-serif;
      font-weight: 500;
      color: var(--dark);
    }

    /* Responsividade para os cards e filtros */
    @media (max-width: 768px) {
      .container-avaliacoes h2 {
        font-size: 1.8rem;
      }

      .filtros-avaliacoes {
        flex-direction: column;
        align-items: flex-start;
        /* Alinha à esquerda em telas menores */
      }

      .filtros-avaliacoes select {
        width: 100%;
        /* Ocupa a largura total */
      }

      .lista-avaliacoes-grid {
        grid-template-columns: 1fr;
        /* Uma coluna em telas menores */
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <a href="main.html" style="text-decoration: none; color: inherit;">
      <h1>Barbearia Manóv</h1>
    </a>
  </header>

  <main>
    <div class="container-avaliacoes">
      <h2>O que Nossos Clientes Dizem</h2>

      <div class="filtros-avaliacoes">
        <label for="ordenar-avaliacoes">Ordenar por:</label>
        <select id="ordenar-avaliacoes" name="ordenar-avaliacoes">
          <option value="recentes">Mais Recentes</option>
          <option value="mais_altas">Melhores Avaliações</option>
          <option value="mais_baixas">Piores Avaliações</option>
        </select>
      </div>

      <div id="lista-avaliacoes" class="lista-avaliacoes-grid">
      </div>

      <div id="paginacao-container" class="paginacao-avaliacoes" style="visibility: hidden;">
        <button id="btnAnteriorAvaliacoes" disabled>Anterior</button>
        <span id="infoPaginaAvaliacoes">Carregando...</span>
        <button id="btnProximoAvaliacoes" disabled>Próximo</button>
      </div>

    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {

        // --- 1. VARIÁVEIS DE CONTROLE ---
        let todosOsFeedbacks = []; // Guarda a lista completa vinda da API
        let feedbacksAtuais = [];   // Guarda a lista após ordenação
        let paginaAtual = 1;
        const itensPorPagina = 6; // Defina quantos feedbacks quer mostrar por página

        // --- 2. REFERÊNCIAS AOS ELEMENTOS DO HTML ---
        const listaUI = document.getElementById('lista-avaliacoes');
        const selectOrdenar = document.getElementById('ordenar-avaliacoes');
        const btnAnterior = document.getElementById('btnAnteriorAvaliacoes');
        const btnProximo = document.getElementById('btnProximoAvaliacoes');
        const infoPaginaUI = document.getElementById('infoPaginaAvaliacoes');
        const paginacaoContainer = document.getElementById('paginacao-container');

        // --- 3. FUNÇÕES DE RENDERIZAÇÃO E LÓGICA ---

        /**
         * "Desenha" a página atual na tela com os itens corretos.
         */
        function renderizarPagina() {
          listaUI.innerHTML = ''; // Limpa a lista antes de redesenhar

          if (feedbacksAtuais.length === 0) {
            listaUI.innerHTML = '<p>Ainda não há avaliações para exibir.</p>';
            if (paginacaoContainer) {
              paginacaoContainer.style.visibility = 'hidden'; // Esconde a paginação
            }
            return;
          }

          const totalPaginas = Math.ceil(feedbacksAtuais.length / itensPorPagina);

          // SÓ MOSTRA A PAGINAÇÃO SE HOUVER MAIS DE UMA PÁGINA
          if (paginacaoContainer) {
            if (totalPaginas > 1) {
              paginacaoContainer.style.visibility = 'visible';
            } else {
              paginacaoContainer.style.visibility = 'hidden';
            }
          }

          const indiceInicio = (paginaAtual - 1) * itensPorPagina;
          const indiceFim = indiceInicio + itensPorPagina;
          const itensDaPagina = feedbacksAtuais.slice(indiceInicio, indiceFim);

          itensDaPagina.forEach(fb => {
            const card = document.createElement('div');
            card.className = 'card-avaliacao';

            const data = new Date(fb.data).toLocaleDateString('pt-BR');
            const nome = fb.cliente?.pessoa?.nome_completo || 'Cliente Anônimo';

            card.innerHTML = `
              <div class="card-avaliacao-header">
                <span class="nome-avaliador">${nome}</span>
                <span class="data-avaliacao">${data}</span>
              </div>
              <div class="estrelas-avaliacao">${createStarRating(fb.nota)}</div>
              <p class="texto-avaliacao">${fb.comentario || ''}</p>
            `;
            listaUI.appendChild(card);
          });

          // Atualiza as informações de paginação
          if (infoPaginaUI) {
            infoPaginaUI.textContent = `Página ${paginaAtual} de ${totalPaginas}`;
          }
          if (btnAnterior) {
            btnAnterior.disabled = paginaAtual === 1;
          }
          if (btnProximo) {
            btnProximo.disabled = paginaAtual === totalPaginas;
          }
        }

        /**
         * Ordena a lista de feedbacks de acordo com a seleção do usuário.
         */
        function ordenarFeedbacks() {
          const criterio = selectOrdenar.value;
          // Cria uma cópia para não alterar a ordem original
          let feedbacksOrdenados = [...todosOsFeedbacks];

          switch (criterio) {
            case 'mais_altas':
              feedbacksOrdenados.sort((a, b) => (b.nota || 0) - (a.nota || 0));
              break;
            case 'mais_baixas':
              feedbacksOrdenados.sort((a, b) => (a.nota || 0) - (b.nota || 0));
              break;
            case 'recentes':
            default:
              feedbacksOrdenados.sort((a, b) => new Date(b.data) - new Date(a.data));
              break;
          }

          feedbacksAtuais = feedbacksOrdenados;
          paginaAtual = 1; // Sempre volta para a primeira página após ordenar
          renderizarPagina();
        }

        // Função auxiliar para criar as estrelas
        function createStarRating(nota) {
          let stars = '';
          for (let i = 1; i <= 5; i++) {
            stars += `<span>${i <= nota ? '★' : '☆'}</span>`;
          }
          return stars;
        }

        // --- 4. INICIALIZAÇÃO E EVENT LISTENERS ---

        async function init() {
          try {
            const response = await fetch('/api/feedbacks');
            const feedbacks = await response.json();
            todosOsFeedbacks = feedbacks;
            ordenarFeedbacks(); // Ordena e renderiza pela primeira vez
          } catch (error) {
            console.error('Erro ao buscar avaliações:', error);
            listaUI.innerHTML = '<p>Não foi possível carregar as avaliações.</p>';
            if (paginacaoContainer) {
              paginacaoContainer.style.visibility = 'hidden';
            }
          }
        }

        // Gatilhos de eventos
        if (selectOrdenar) {
          selectOrdenar.addEventListener('change', ordenarFeedbacks);
        }
        if (btnProximo) {
          btnProximo.addEventListener('click', () => {
            paginaAtual++;
            renderizarPagina();
          });
        }
        if (btnAnterior) {
          btnAnterior.addEventListener('click', () => {
            paginaAtual--;
            renderizarPagina();
          });
        }

        // Inicia a aplicação
        init();
      });
    </script>
  </main>
</body>

</html>
