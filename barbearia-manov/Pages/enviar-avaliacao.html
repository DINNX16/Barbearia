<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enviar-Avaliação</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --primary: #1a1a1a;
      --secondary: #db902e;
      --light: #f8f9fa;
      --dark: #212529;
    }

    body {
      font-family: "Montserrat", sans-serif;
      margin: 0;
      padding: 0;
      background-color: var(--light);
      color: var(--dark);
    }

    .header {
      background-color: var(--primary);
      color: white;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 11px rgba(0, 0, 0, 0.1);
      position: relative;
      flex-shrink: 0;
      width: 100%;
      /* A
    dicione esta linha */


    }

    /* Título H1 dentro do Header */
    .header h1 {
      font-family: "Playfair Display", serif;
      color: var(--secondary);
      margin: 1rem 0;
      font-size: 1.8rem;
      text-align: center;
    }

    .container-avaliacoes {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 2rem;
      background-color: var(--light);
      border-radius: 8px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .container-avaliacoes h2 {
      font-family: "Playfair Display", serif;
      color: var(--primary);
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2.2rem;
    }

    .filtros-avaliacoes {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 1.5rem;
      gap: 0.5rem;
    }

    .filtros-avaliacoes label {
      font-family: "Montserrat", sans-serif;
      font-size: 0.9rem;
      color: var(--dark);
      font-weight: 500;
    }

    .filtros-avaliacoes select {
      font-family: "Montserrat", sans-serif;
      padding: 0.5rem 0.8rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9rem;
      background-color: #fff;
      cursor: pointer;
    }

    .lista-avaliacoes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      /* Cria colunas responsivas */
      gap: 1.5rem;
      /* Espaçamento entre os cards */
      margin-bottom: 2rem;
    }

    .card-avaliacao {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
      display: flex;
      flex-direction: column;
      transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
    }

    .card-avaliacao:hover {
      transform: translateY(-5px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    .card-avaliacao-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .nome-avaliador {
      font-family: "Montserrat", sans-serif;
      font-weight: 700;
      color: var(--primary);
      font-size: 1.1rem;
    }

    .data-avaliacao {
      font-family: "Montserrat", sans-serif;
      font-size: 0.8rem;
      color: #777;
    }

    .estrelas-avaliacao {
      margin-bottom: 1rem;
      font-size: 1.3rem;
      /* Tamanho das estrelas */
    }

    .estrelas-avaliacao span {
      /* Estilo para as estrelas */
      color: var(--secondary);
      /* Cor dourada para estrelas preenchidas */
      margin-right: 2px;
    }

    /* Para estrelas vazias, você pode usar um caractere diferente ou mudar a cor:
.estrelas-avaliacao span.vazia { color: #ccc; }
O JavaScript preencheria isso corretamente com base na nota. */


    .texto-avaliacao {
      font-family: "Montserrat", sans-serif;
      font-size: 0.95rem;
      line-height: 1.6;
      color: var(--dark);
      margin-bottom: 1rem;
      flex-grow: 1;
      /* Faz o texto ocupar o espaço disponível */
    }

    .avaliacao-servico-info {
      font-family: "Montserrat", sans-serif;
      font-size: 0.85rem;
      color: #555;
      padding-top: 0.75rem;
      border-top: 1px dashed #eee;
      margin-top: auto;
      /* Empurra para o final do card se o texto for curto */
    }

    .avaliacao-servico-info span {
      font-weight: 500;
    }


    .paginacao-avaliacoes {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      padding-top: 1rem;
      border-top: 1px solid #e0e0e0;
    }

    .paginacao-avaliacoes button {
      font-family: "Montserrat", sans-serif;
      background-color: var(--primary);
      color: var(--light);
      border: 1px solid var(--primary);
      padding: 0.6rem 1.2rem;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .paginacao-avaliacoes button:hover:not(:disabled) {
      background-color: var(--secondary);
      color: var(--primary);
      border-color: var(--secondary);
    }

    .paginacao-avaliacoes button:disabled {
      background-color: #ccc;
      color: #666;
      border-color: #ccc;
      cursor: not-allowed;
    }

    .paginacao-avaliacoes #infoPaginaAvaliacoes {
      font-family: "Montserrat", sans-serif;
      font-weight: 500;
      color: var(--dark);
    }

    /* Responsividade para os cards e filtros */
    @media (max-width: 768px) {
      .container-avaliacoes h2 {
        font-size: 1.8rem;
      }

      .filtros-avaliacoes {
        flex-direction: column;
        align-items: flex-start;
        /* Alinha à esquerda em telas menores */
      }

      .filtros-avaliacoes select {
        width: 100%;
        /* Ocupa a largura total */
      }

      .lista-avaliacoes-grid {
        grid-template-columns: 1fr;
        /* Uma coluna em telas menores */
      }
    }



    /* Adicione dentro da <style> do enviar-avaliacao.html */
    .form-group {
      margin-bottom: 1.5rem;
    }

    .form-group label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    textarea {
      width: 100%;
      padding: 0.8rem;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-family: 'Montserrat', sans-serif;
      font-size: 1rem;
    }

    .btn-enviar {
      background-color: var(--primary);
      color: white;
      padding: 0.8rem 1.5rem;
      border: none;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .btn-enviar:hover {
      background-color: var(--secondary);
      color: var(--primary);
    }

    /* Estilo para as estrelas interativas */
    .rating-stars {
      display: flex;
      flex-direction: row-reverse;
      /* <-- A MÁGICA ACONTECE AQUI */
      justify-content: flex-end;
      /* Alinha as estrelas à esquerda */
    }

    .rating-stars input[type="radio"] {
      display: none;
    }

    .rating-stars label {
      color: #ddd;
      font-size: 2.5rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    /* Pinta de amarelo a estrela que o mouse está em cima E todas as anteriores (que agora são as próximas no código) */
    .rating-stars label:hover,
    .rating-stars label:hover~label {
      color: var(--secondary);
    }

    /* Pinta de amarelo as estrelas selecionadas (e as anteriores) */
    .rating-stars input[type="radio"]:checked~label {
      color: var(--secondary);
    }
  </style>
</head>

<body>
  <header class="header">
    <a href="main.html" style="text-decoration: none; color: inherit;">
      <h1>Barbearia Manóv</h1>
    </a>
  </header>

  <main>
    <div class="container-avaliacoes">
      <h2>Deixe sua Avaliação</h2>
      <p style="text-align:center; margin-top:-1.5rem; margin-bottom: 2rem;">Sua opinião é muito importante para nós!
      </p>

      <form id="form-avaliacao">
        <div class="form-group">
          <label>Sua Nota:</label>
          <div class="rating-stars">
            <input type="radio" id="star1" name="nota" value="1" required /><label for="star1">★</label>
            <input type="radio" id="star2" name="nota" value="2" /><label for="star2">★</label>
            <input type="radio" id="star3" name="nota" value="3" /><label for="star3">★</label>
            <input type="radio" id="star4" name="nota" value="4" /><label for="star4">★</label>
            <input type="radio" id="star5" name="nota" value="5" /><label for="star5">★</label>
          </div>
        </div>
        <div class="form-group">
          <label for="comentario">Seu Comentário (opcional):</label>
          <textarea id="comentario" name="comentario" rows="5"
            placeholder="Conte-nos mais sobre sua experiência..."></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn-enviar">Enviar Avaliação</button>
        </div>
      </form>
      <div id="mensagem-sucesso" style="display:none; text-align:center; color:green; margin-top:1rem;">
        Obrigado! Sua avaliação foi enviada com sucesso.
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('form-avaliacao');
      const sucessoMsg = document.getElementById('mensagem-sucesso');

      form.addEventListener('submit', async (event) => {
        event.preventDefault(); // Impede o recarregamento da página

        const formData = new FormData(form);
        const nota = formData.get('nota');
        const comentario = formData.get('comentario');
        const token = localStorage.getItem('seuTokenJWT'); // Pega o token do usuário logado

        if (!token) {
          alert('Você precisa estar logado para enviar uma avaliação.');
          return;
        }

        try {
          const response = await fetch('/api/feedbacks', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ nota, comentario })
          });

          if (response.ok) {
            form.style.display = 'none';
            sucessoMsg.style.display = 'block';
          } else {
            const errorData = await response.json();
            alert(`Erro: ${errorData.error}`);
          }
        } catch (error) {
          console.error('Erro ao enviar formulário:', error);
          alert('Não foi possível enviar sua avaliação. Tente novamente mais tarde.');
        }
      });
    });

  </script>
  </style>
</body>

</html>
